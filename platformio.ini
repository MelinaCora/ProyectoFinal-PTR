[env:uno]
platform = atmelavr
board = uno
framework = arduino
lib_deps =
    marcoschwartz/LiquidCrystal_I2C@^1.1.4

; Host unit test for src/ciclo.h (needs a system C++ compiler).
[env:test_ciclo]
platform = native
build_src_filter = -<*> +<../test/test_ciclo.cpp>
build_flags = -std=c++17 -Wall -Wextra
